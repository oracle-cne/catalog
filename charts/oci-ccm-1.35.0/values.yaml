global:
  oci:
    registry: "ghcr.io/oracle"
  csi:
    registry: "olcne"
  compact: false
  namespace: kube-system

oci:
  useinstanceprincipals: false
  privatekey: ""

volumeProvisionerConfig: oci-volume-provisioner
cloudControllerManagerConfig: oci-cloud-controller-manager

cloud-provider-oci: "v1.35.0"

csi-provisioner: "v6.3.0"

csi-attacher: "v4.12.0"

csi-resizer: "v2.2.0"

csi-node-driver-registrar: "v2.17.0"

csi-snapshotter: "v8.6.0"

legacyControlPlaneAnnotation: false
