repo: https://docs.tigera.io/calico/charts
chart: tigera-operator
icon: calico-logo.png
catalogVersionFromValues:
  yq: '.tigeraOperator.version | sub("^v"; "") | sub("-.*$"; "")'
crdCharts:
  - chart: crd.projectcalico.org.v1
    sourceDir: templates
    destDir: crds
values:
  installation:
    registry: container-registry.oracle.com/
    imagePath: olcne
    flexVolumePath: /var/lib/kubelet/volumeplugins/
  tigeraOperator:
    image: tigera-operator
    registry: olcne
  calicoctl:
    image: olcne/ctl
  goldmane:
    enabled: false
  whisker:
    enabled: false

latestImages:
  - name: .tigeraOperator.registry + "/" + .tigeraOperator.image
    tag: .tigeraOperator.version
