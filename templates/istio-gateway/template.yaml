repo: https://istio-release.storage.googleapis.com/charts
chart: gateway
icon: android-192x192.png
kubeVersion:
  minimum:
    url: https://raw.githubusercontent.com/istio/istio.io/refs/heads/master/data/compatibility/supportStatus.yml
    command: |
      yq -r '.[] | select(.version == (strenv(APP_VERSION) | split(".") | .[0:2] | join("."))) | .k8sVersions[0] + ".0"'
  maximum:
    url: https://raw.githubusercontent.com/istio/istio.io/refs/heads/master/data/compatibility/supportStatus.yml
    command: |
      yq -r '.[] | select(.version == (strenv(APP_VERSION) | split(".") | .[0:2] | join("."))) | (.k8sVersions[-1] | split(".") | .[0] + "." + ((.[1] | tonumber) + 1 | tostring) + ".0")'
values: {}

extraValuesYqs:
  - |
    with(select(has("name")); .hub = "olcne" | .image = "proxyv2" | .tag = strenv(APP_VERSION))
  - |
    with(select(has("defaults")); .defaults.hub = "olcne" | .defaults.image = "proxyv2" | .defaults.tag = strenv(APP_VERSION))
  - |
    with(select(has("_internal_defaults_do_not_set")); ._internal_defaults_do_not_set.hub = "olcne" | ._internal_defaults_do_not_set.image = "proxyv2" | ._internal_defaults_do_not_set.tag = strenv(APP_VERSION))

extraFileYqs:
  - file: files/profile-ambient.yaml
    yq: '.global.variant = ""'

patches:
  - patch: |
      --- templates/deployment.yaml
      +++ templates/deployment.yaml
      @@ -49,8 +49,7 @@
             {{- end }}
             containers:
               - name: istio-proxy
      -          # "auto" will be populated at runtime by the mutating webhook. See https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#customizing-injection
      -          image: auto
      +          image: "{{ .Values.hub }}/{{ .Values.image | default "proxyv2" }}:{{ .Values.tag }}"
                {{- with .Values.imagePullPolicy }}
                imagePullPolicy: {{ . }}
                {{- end }}
