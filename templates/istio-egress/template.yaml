  - patch: |
      --- templates/_helpers.tpl
      +++ templates/_helpers.tpl
      @@ -24,9 +24,9 @@
       Keep sidecar injection labels together
       https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#controlling-the-injection-policy
       */}}
       {{- define "gateway.sidecarInjectionLabels" -}}
