repo: https://istio-release.storage.googleapis.com/charts
chart: gateway
icon: android-192x192.png
kubeVersion:
  minimum:
    url: https://raw.githubusercontent.com/istio/istio.io/refs/heads/master/data/compatibility/supportStatus.yml
    command: |
      yq -r '.[] | select(.version == (strenv(APP_VERSION) | split(".") | .[0:2] | join("."))) | .k8sVersions[0] + ".0"'
  maximum:
    url: https://raw.githubusercontent.com/istio/istio.io/refs/heads/master/data/compatibility/supportStatus.yml
    command: |
      yq -r '.[] | select(.version == (strenv(APP_VERSION) | split(".") | .[0:2] | join("."))) | (.k8sVersions[-1] | split(".") | .[0] + "." + ((.[1] | tonumber) + 1 | tostring) + ".0")'
values: {}

extraChartYqs:
  - '.keywords = ["istio", "egressgateway", "gateways"]'
  - 'del(.type)'

extraValuesYqs:
  - |
    with(select(has("name"));
      .name = "istio-egressgateway" |
      .replicaCount = null |
      .labels = {"app": "istio-egressgateway", "istio": "egressgateway"} |
      .podAnnotations."sidecar.istio.io/inject" = "false" |
      del(.podAnnotations."inject.istio.io/templates") |
      .service.type = "ClusterIP" |
      .service.ports = [
        {"port": 80, "targetPort": 8080, "name": "http2", "protocol": "TCP"},
        {"port": 443, "targetPort": 8443, "name": "https", "protocol": "TCP"}
      ] |
      .global.hub = "olcne" |
      .global.tag = strenv(APP_VERSION) |
      .global.variant = "" |
      .global.proxy.image = "proxyv2"
    )
  - |
    with(select(has("defaults"));
      .defaults.name = "istio-egressgateway" |
      .defaults.replicaCount = null |
      .defaults.labels = {"app": "istio-egressgateway", "istio": "egressgateway"} |
      .defaults.podAnnotations."sidecar.istio.io/inject" = "false" |
      del(.defaults.podAnnotations."inject.istio.io/templates") |
      .defaults.service.type = "ClusterIP" |
      .defaults.service.ports = [
        {"port": 80, "targetPort": 8080, "name": "http2", "protocol": "TCP"},
        {"port": 443, "targetPort": 8443, "name": "https", "protocol": "TCP"}
      ] |
      .defaults.global.hub = "olcne" |
      .defaults.global.tag = strenv(APP_VERSION) |
      .defaults.global.variant = "" |
      .defaults.global.proxy.image = "proxyv2"
    )
  - |
    with(select(has("_internal_defaults_do_not_set"));
      ._internal_defaults_do_not_set.name = "istio-egressgateway" |
      ._internal_defaults_do_not_set.replicaCount = null |
      ._internal_defaults_do_not_set.labels = {"app": "istio-egressgateway", "istio": "egressgateway"} |
      ._internal_defaults_do_not_set.podAnnotations."sidecar.istio.io/inject" = "false" |
      del(._internal_defaults_do_not_set.podAnnotations."inject.istio.io/templates") |
      ._internal_defaults_do_not_set.service.type = "ClusterIP" |
      ._internal_defaults_do_not_set.service.ports = [
        {"port": 80, "targetPort": 8080, "name": "http2", "protocol": "TCP"},
        {"port": 443, "targetPort": 8443, "name": "https", "protocol": "TCP"}
      ] |
      ._internal_defaults_do_not_set.global.hub = "olcne" |
      ._internal_defaults_do_not_set.global.tag = strenv(APP_VERSION) |
      ._internal_defaults_do_not_set.global.variant = "" |
      ._internal_defaults_do_not_set.global.proxy.image = "proxyv2"
    )

extraFileYqs:
  - file: files/profile-ambient.yaml
    yq: '.global.variant = ""'

patches:
  - patch: |
      --- templates/deployment.yaml
      +++ templates/deployment.yaml
      @@ -49,8 +49,7 @@
             {{- end }}
             containers:
               - name: istio-proxy
      -          # "auto" will be populated at runtime by the mutating webhook. See https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#customizing-injection
      -          image: auto
      +          image: "{{ .Values.global.hub }}/{{ .Values.global.proxy.image | default "proxyv2" }}:{{ .Values.global.tag }}{{with (.Values.global.proxy.variant | default .Values.global.variant)}}-{{.}}{{end}}"
                {{- with .Values.imagePullPolicy }}
                imagePullPolicy: {{ . }}
                {{- end }}
