apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-operator-log-test
  labels:
    app.kubernetes.io/name: fluent-operator-log-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-operator-log-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-operator-log-test
    spec:
      containers:
      - name: log-writer
        image: container-registry.oracle.com/os/oraclelinux:8
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo OCNE_FLUENT_OPERATOR_LOG_TEST_MARKER
            sleep 5
          done
